<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LINEスタンプ対応 ドット絵アニメエディター (APNG/GIF対応版)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/omggif/1.0.10/omggif.min.js"></script>
  <style>
    :root {
      --bg-color: #1a1a24;
      --panel-bg: #272736;
      --panel-header-bg: #353549;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --line-green: #06c755;
      --line-green-hover: #05b34c;
      --text-color: #f3f4f6;
      --border-color: #3f3f56;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #workspace {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
    }

    #canvas-wrapper {
      position: absolute;
      border: 2px solid var(--accent-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transform-origin: center center;
      touch-action: none;
      cursor: crosshair;
    }

    .transparent-bg {
      background-image: 
        linear-gradient(45deg, #ccc 25%, transparent 25%), 
        linear-gradient(-45deg, #ccc 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #ccc 75%), 
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #ffffff;
    }

    .opaque-bg {
      background-color: #ffffff;
    }

    #canvas-wrapper.panning { cursor: grab !important; }
    #canvas-wrapper.panning:active { cursor: grabbing !important; }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      image-rendering: pixelated;
    }

    #onionCanvas { opacity: 0.35; pointer-events: none; }
    #gridCanvas, #hoverCanvas { pointer-events: none; }

    .draggable-panel {
      position: absolute;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
      min-width: 180px;
      min-height: 100px;
      resize: both;
      overflow: auto;
    }

    .panel-header {
      padding: 8px 12px;
      background: var(--panel-header-bg);
      border-top-left-radius: 7px;
      border-top-right-radius: 7px;
      cursor: move;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
      touch-action: none;
    }

    .panel-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    label {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    input[type="number"], select, input[type="text"] {
      background: #1e1e28;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 4px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    input[type="number"] {
      width: 55px;
      text-align: center;
    }

    select {
      width: 100%;
    }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    button {
      background: #38384a;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #4a4a62; }
    button.primary { background: var(--accent-color); }
    button.primary:hover { background: var(--accent-hover); }
    button.line-btn { background: var(--line-green); }
    button.line-btn:hover { background: var(--line-green-hover); }
    button.danger { background: #991b1b; }

    .btn-group {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .btn-group button { flex: 1; }

    .shift-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      width: 100%;
      margin-top: 4px;
    }
    .shift-pad button {
      padding: 4px;
      font-size: 0.8rem;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
      gap: 4px;
      margin-top: 4px;
    }

    .palette-color {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 2px solid #555;
      cursor: pointer;
    }

    .palette-color.selected {
      border-color: #fff;
      transform: scale(1.1);
    }

    /* モーダル用スタイル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      width: 300px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-title {
      font-size: 0.9rem;
      font-weight: bold;
    }

    #panel-size { top: 20px; left: 20px; width: 250px; }
    #panel-tools { top: 230px; left: 20px; width: 200px; }
    #panel-color { top: 20px; right: 20px; width: 200px; }
    #panel-anim { bottom: 20px; left: 20px; width: 240px; }
    #panel-view { bottom: 20px; right: 20px; width: 260px; }
  </style>
</head>
<body>

  <div id="workspace">
    <div id="canvas-wrapper" class="transparent-bg">
      <canvas id="onionCanvas"></canvas>
      <canvas id="mainCanvas"></canvas>
      <canvas id="gridCanvas"></canvas>
      <canvas id="hoverCanvas"></canvas>
    </div>
  </div>

  <div id="filenameModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-title">💾 保存ファイル名の指定</div>
      <label style="display: flex; flex-direction: column; gap: 4px;">
        <span>ファイル名:</span>
        <input type="text" id="customFilenameInput" style="width: 100%; padding: 6px;" placeholder="例: my_stamp">
      </label>
      <div class="btn-group" style="justify-content: flex-end;">
        <button id="modalCancelBtn">キャンセル</button>
        <button id="modalConfirmBtn" class="primary">保存</button>
      </div>
    </div>
  </div>

  <div id="panel-size" class="draggable-panel">
    <div class="panel-header">📐 キャンバスサイズ</div>
    <div class="panel-body">
      <label style="font-weight:bold;">LINE公式規定プリセット:</label>
      <select id="presetSelect">
        <option value="custom">カスタム（ドット絵用）</option>
        <option value="16x16" selected>16 x 16 (標準ドット)</option>
        <option value="32x32">32 x 32 (標準ドット)</option>
        <option value="48x48">48 x 48 (高精細ドット)</option>
        <option value="line_anim">LINE動くスタンプ (320x270)</option>
        <option value="line_static">LINE静止画スタンプ (370x320)</option>
        <option value="line_main">LINEメイン画像 (240x240)</option>
        <option value="line_tab">LINEトーク部屋タブ (96x74)</option>
      </select>

      <div class="row">
        <label>幅: <input type="number" id="gridW" value="16" min="4" max="370"></label>
        <label>高: <input type="number" id="gridH" value="16" min="4" max="320"></label>
        <button id="applySizeBtn" class="primary">適用</button>
      </div>

      <div class="row">
        <label><input type="checkbox" id="transparentToggle" checked> 背景を透過する</label>
      </div>
    </div>
  </div>

  <div id="panel-tools" class="draggable-panel">
    <div class="panel-header">✏️ ツール</div>
    <div class="panel-body">
      <div class="btn-group">
        <button id="penBtn" class="primary">ペン</button>
        <button id="eraserBtn">消しゴム</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="gridToggle" checked> グリッド表示</label>
      </div>
      <button id="clearBtn" class="danger">クリア</button>
    </div>
  </div>

  <div id="panel-color" class="draggable-panel">
    <div class="panel-header">🎨 カラーパレット</div>
    <div class="panel-body">
      <div class="row" style="justify-content: space-between;">
        <label>描画色:</label>
        <input type="color" id="colorPicker" value="#000000">
      </div>
      <div class="palette-grid" id="paletteGrid"></div>
    </div>
  </div>

  <div id="panel-anim" class="draggable-panel">
    <div class="panel-header">🎬 アニメーション</div>
    <div class="panel-body">
      <div class="row" style="justify-content: space-between;">
        <span id="frameIndicator" style="font-weight: bold; font-size: 0.8rem;">コマ: 1 / 1</span>
        <label><input type="checkbox" id="onionToggle" checked> 前コマ透過</label>
      </div>
      
      <div class="row" style="justify-content: space-between;">
        <label>1コマ表示(ms): <input type="number" id="frameDelayInput" value="200" min="50" max="2000" step="10"></label>
      </div>

      <div class="btn-group">
        <button id="prevFrameBtn">◀ 前</button>
        <button id="nextFrameBtn">次 ▶</button>
      </div>
      <div class="btn-group">
        <button id="addFrameBtn">＋ 新規コマ</button>
        <button id="copyFrameBtn" class="primary">📋 複製</button>
      </div>

      <label style="margin-top: 4px; font-weight: bold;">↔ 位置調整</label>
      <div class="shift-pad">
        <div></div>
        <button id="shiftUpBtn">▲</button>
        <div></div>
        <button id="shiftLeftBtn">◀</button>
        <div></div>
        <button id="shiftRightBtn">▶</button>
        <div></div>
        <button id="shiftDownBtn">▼</button>
        <div></div>
      </div>

      <div class="btn-group" style="margin-top: 4px;">
        <button id="playBtn" class="primary">▶ 再生</button>
        <button id="deleteFrameBtn" class="danger">コマ削除</button>
      </div>
    </div>
  </div>

  <div id="panel-view" class="draggable-panel">
    <div class="panel-header">💬 書き出し設定</div>
    <div class="panel-body">
      <div class="btn-group">
        <button id="zoomInBtn">🔍＋</button>
        <button id="zoomResetBtn">100%</button>
        <button id="zoomOutBtn">🔍ー</button>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 4px 0;">
      
      <label style="font-weight: bold; color: #a7f3d0;">💾 ファイル書き出し</label>
      
      <div class="row" style="justify-content: space-between;">
        <label>拡大倍率:</label>
        <select id="exportScaleSelect" style="width: 130px;">
          <option value="1">1倍 (等倍)</option>
          <option value="auto_line" selected>自動 (LINE規格320px)</option>
          <option value="5">5倍</option>
          <option value="10">10倍</option>
          <option value="20">20倍</option>
        </select>
      </div>

      <div class="row" style="justify-content: space-between;">
        <label>APNGループ数:</label>
        <select id="loopCountSelect" style="width: 110px;">
          <option value="4" selected>4回 (LINE規定)</option>
          <option value="1">1回</option>
          <option value="2">2回</option>
          <option value="3">3回</option>
          <option value="0">無限ループ</option>
        </select>
      </div>

      <div class="row" style="justify-content: space-between; margin-top: 4px;">
        <label style="font-weight: bold;">保存形式:</label>
        <select id="exportFormatSelect" style="width: 140px; font-weight: bold; color: #a7f3d0;">
          <option value="apng" selected>APNG (LINEスタンプ)</option>
          <option value="gif">GIF アニメ</option>
          <option value="webm">WebM 動画</option>
          <option value="png">PNG 静止画 (現コマ)</option>
        </select>
      </div>

      <button id="executeExportBtn" class="line-btn" style="width:100%; margin-top: 4px; padding: 8px;">💾 指定した形式で保存</button>
    </div>
  </div>

  <script>
    // --- APNG エンコーダー ---
    class StandaloneApngEncoder {
      constructor(width, height, delayMs, loopCount = 0) {
        this.width = width;
        this.height = height;
        this.delayMs = delayMs;
        this.loopCount = loopCount;
        this.crcTable = this.makeCrcTable();
      }

      makeCrcTable() {
        const cTable = [];
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) {
            c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
          }
          cTable[n] = c;
        }
        return cTable;
      }

      crc32(buf, off, len) {
        let c = -1;
        for (let i = 0; i < len; i++) {
          c = this.crcTable[(c ^ buf[off + i]) & 0xff] ^ (c >>> 8);
        }
        return (c ^ -1) >>> 0;
      }

      writeChunk(type, data) {
        const len = data.length;
        const buf = new Uint8Array(12 + len);
        const view = new DataView(buf.buffer);

        view.setUint32(0, len);
        for (let i = 0; i < 4; i++) buf[4 + i] = type.charCodeAt(i);
        buf.set(data, 8);

        const crc = this.crc32(buf, 4, len + 4);
        view.setUint32(8 + len, crc);
        return buf;
      }

      async createPngBlob(canvasDataUrls) {
        const buffers = await Promise.all(canvasDataUrls.map(async url => {
          const res = await fetch(url);
          return new Uint8Array(await res.arrayBuffer());
        }));

        const chunks = [];
        chunks.push(new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]));

        const firstPng = buffers[0];
        let pos = 8;
        let ihdrChunk = null;

        while (pos < firstPng.length) {
          const len = new DataView(firstPng.buffer).getUint32(pos);
          const type = String.fromCharCode(...firstPng.slice(pos + 4, pos + 8));
          if (type === 'IHDR') {
            ihdrChunk = firstPng.slice(pos, pos + 12 + len);
            break;
          }
          pos += 12 + len;
        }
        chunks.push(ihdrChunk);

        const actlData = new Uint8Array(8);
        const actlView = new DataView(actlData.buffer);
        actlView.setUint32(0, buffers.length);
        actlView.setUint32(4, this.loopCount);
        chunks.push(this.writeChunk('acTL', actlData));

        let sequenceNumber = 0;

        for (let i = 0; i < buffers.length; i++) {
          const png = buffers[i];
          pos = 8;
          let idatBytes = [];

          while (pos < png.length) {
            const len = new DataView(png.buffer).getUint32(pos);
            const type = String.fromCharCode(...png.slice(pos + 4, pos + 8));
            if (type === 'IDAT') {
              idatBytes.push(png.slice(pos + 8, pos + 8 + len));
            }
            pos += 12 + len;
          }

          const fctlData = new Uint8Array(26);
          const fctlView = new DataView(fctlData.buffer);
          fctlView.setUint32(0, sequenceNumber++);
          fctlView.setUint32(4, this.width);
          fctlView.setUint32(8, this.height);
          fctlView.setUint32(12, 0);
          fctlView.setUint32(16, 0);
          fctlView.setUint16(20, this.delayMs);
          fctlView.setUint16(22, 1000);
          fctlData[24] = 0;
          fctlData[25] = 0;

          chunks.push(this.writeChunk('fcTL', fctlData));

          for (const rawIdat of idatBytes) {
            if (i === 0) {
              chunks.push(this.writeChunk('IDAT', rawIdat));
            } else {
              const fdatData = new Uint8Array(4 + rawIdat.length);
              const fdatView = new DataView(fdatData.buffer);
              fdatView.setUint32(0, sequenceNumber++);
              fdatData.set(rawIdat, 4);
              chunks.push(this.writeChunk('fdAT', fdatData));
            }
          }
        }

        chunks.push(this.writeChunk('IEND', new Uint8Array(0)));
        return new Blob(chunks, { type: 'image/png' });
      }
    }

    // --- エディター本体 ---
    let cols = 16;
    let rows = 16;
    let pixelScale = 20;

    let frames = [];
    let currentFrameIndex = 0;

    let isDrawing = false;
    let isEraser = false;
    let isPlaying = false;
    let playInterval = null;

    let currentZoom = 1.0;
    let panX = 0, panY = 0;
    let isPanning = false;
    let startPanX = 0, startPanY = 0;
    let isSpacePressed = false;

    // タッチ操作用変数
    let touchStartDist = 0;
    let initialZoom = 1.0;
    let touchStartMidX = 0;
    let touchStartMidY = 0;
    let initialPanX = 0;
    let initialPanY = 0;

    const wrapper = document.getElementById('canvas-wrapper');
    const mainCanvas = document.getElementById('mainCanvas');
    const onionCanvas = document.getElementById('onionCanvas');
    const gridCanvas = document.getElementById('gridCanvas');
    const hoverCanvas = document.getElementById('hoverCanvas');

    const mainCtx = mainCanvas.getContext('2d');
    const onionCtx = onionCanvas.getContext('2d');
    const gridCtx = gridCanvas.getContext('2d');
    const hoverCtx = hoverCanvas.getContext('2d');

    function initEditor() {
      updateCanvasDimensions();
      if (frames.length === 0) frames.push(createEmptyFrame());
      render();
      drawGrid();
    }

    function createEmptyFrame() {
      return Array(rows).fill(null).map(() => Array(cols).fill(null));
    }

    function updateCanvasDimensions() {
      if (cols > 64 || rows > 64) {
        pixelScale = Math.max(2, Math.floor(400 / Math.max(cols, rows)));
      } else {
        pixelScale = 20;
      }

      const renderW = cols * pixelScale;
      const renderH = rows * pixelScale;

      wrapper.style.width = `${renderW}px`;
      wrapper.style.height = `${renderH}px`;

      [mainCanvas, onionCanvas, gridCanvas, hoverCanvas].forEach(c => {
        c.width = renderW;
        c.height = renderH;
        c.style.width = `${renderW}px`;
        c.style.height = `${renderH}px`;
      });

      applyTransform();
    }

    function render() {
      mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      onionCtx.clearRect(0, 0, onionCanvas.width, onionCanvas.height);

      if (!document.getElementById('transparentToggle').checked) {
        mainCtx.fillStyle = '#ffffff';
        mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
      }

      const showOnion = document.getElementById('onionToggle').checked;
      if (showOnion && currentFrameIndex > 0 && !isPlaying) {
        drawFrameData(onionCtx, frames[currentFrameIndex - 1], pixelScale);
      }

      drawFrameData(mainCtx, frames[currentFrameIndex], pixelScale);
      document.getElementById('frameIndicator').textContent = `コマ: ${currentFrameIndex + 1} / ${frames.length}`;
    }

    function drawFrameData(ctx, frameData, scale) {
      if (!frameData) return;
      for (let r = 0; r < rows; r++) {
        if (!frameData[r]) continue;
        for (let c = 0; c < cols; c++) {
          if (frameData[r][c]) {
            ctx.fillStyle = frameData[r][c];
            ctx.fillRect(c * scale, r * scale, scale, scale);
          }
        }
      }
    }

    function drawGrid() {
      gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
      if (!document.getElementById('gridToggle').checked) return;

      gridCtx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
      gridCtx.lineWidth = 1;

      for (let c = 0; c <= cols; c++) {
        gridCtx.beginPath();
        gridCtx.moveTo(c * pixelScale, 0);
        gridCtx.lineTo(c * pixelScale, gridCanvas.height);
        gridCtx.stroke();
      }
      for (let r = 0; r <= rows; r++) {
        gridCtx.beginPath();
        gridCtx.moveTo(0, r * pixelScale);
        gridCtx.lineTo(gridCanvas.width, r * pixelScale);
        gridCtx.stroke();
      }
    }

    function drawHover(col, row) {
      hoverCtx.clearRect(0, 0, hoverCanvas.width, hoverCanvas.height);
      if (col < 0 || col >= cols || row < 0 || row >= rows || isPlaying || isPanning) return;

      hoverCtx.strokeStyle = '#6366f1';
      hoverCtx.lineWidth = 2;
      hoverCtx.strokeRect(col * pixelScale, row * pixelScale, pixelScale, pixelScale);
      hoverCtx.fillStyle = 'rgba(99, 102, 241, 0.25)';
      hoverCtx.fillRect(col * pixelScale, row * pixelScale, pixelScale, pixelScale);
    }

    function handlePointer(e) {
      if (isPanning) {
        panX += e.clientX - startPanX;
        panY += e.clientY - startPanY;
        startPanX = e.clientX;
        startPanY = e.clientY;
        applyTransform();
        return;
      }

      const rect = mainCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / currentZoom;
      const y = (e.clientY - rect.top) / currentZoom;

      const col = Math.floor(x / pixelScale);
      const row = Math.floor(y / pixelScale);

      drawHover(col, row);

      if (isDrawing && !isPlaying) {
        if (row >= 0 && row < rows && col >= 0 && col < cols) {
          const color = isEraser ? null : document.getElementById('colorPicker').value;
          frames[currentFrameIndex][row][col] = color;
          render();
        }
      }
    }

    // --- ポインター / マウス操作 ---
    mainCanvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') return;

      if (e.button === 1 || isSpacePressed) {
        isPanning = true;
        startPanX = e.clientX;
        startPanY = e.clientY;
        mainCanvas.setPointerCapture(e.pointerId);
        return;
      }
      if (e.button === 0) {
        isDrawing = true;
        mainCanvas.setPointerCapture(e.pointerId);
        handlePointer(e);
      }
    });

    mainCanvas.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      handlePointer(e);
    });

    mainCanvas.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'touch') return;
      isPanning = false;
      isDrawing = false;
      try { mainCanvas.releasePointerCapture(e.pointerId); } catch(err){}
    });

    mainCanvas.addEventListener('pointerleave', () => hoverCtx.clearRect(0, 0, hoverCanvas.width, hoverCanvas.height));

    // --- タッチ操作 ---
    mainCanvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDrawing = true;
        const touch = e.touches[0];
        handlePointer({ clientX: touch.clientX, clientY: touch.clientY });
      } else if (e.touches.length === 2) {
        isDrawing = false;
        isPanning = true;

        const t1 = e.touches[0];
        const t2 = e.touches[1];

        touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        initialZoom = currentZoom;

        touchStartMidX = (t1.clientX + t2.clientX) / 2;
        touchStartMidY = (t1.clientY + t2.clientY) / 2;
        initialPanX = panX;
        initialPanY = panY;

        hoverCtx.clearRect(0, 0, hoverCanvas.width, hoverCanvas.height);
      }
    }, { passive: false });

    mainCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();

      if (e.touches.length === 1 && isDrawing) {
        const touch = e.touches[0];
        handlePointer({ clientX: touch.clientX, clientY: touch.clientY });
      } else if (e.touches.length === 2) {
        const t1 = e.touches[0];
        const t2 = e.touches[1];

        const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        if (touchStartDist > 0) {
          const scaleChange = currentDist / touchStartDist;
          currentZoom = Math.min(Math.max(initialZoom * scaleChange, 0.1), 5.0);
        }

        const currentMidX = (t1.clientX + t2.clientX) / 2;
        const currentMidY = (t1.clientY + t2.clientY) / 2;

        panX = initialPanX + (currentMidX - touchStartMidX);
        panY = initialPanY + (currentMidY - touchStartMidY);

        applyTransform();
      }
    }, { passive: false });

    mainCanvas.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) isPanning = false;
      if (e.touches.length === 0) isDrawing = false;
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isSpacePressed) {
        isSpacePressed = true;
        wrapper.classList.add('panning');
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        isSpacePressed = false;
        wrapper.classList.remove('panning');
      }
    });

    function applyTransform() {
      wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
    }

    function updateZoom(newZoom) {
      currentZoom = Math.min(Math.max(newZoom, 0.1), 5.0);
      applyTransform();
    }

    document.getElementById('zoomInBtn').onclick = () => updateZoom(currentZoom + 0.2);
    document.getElementById('zoomOutBtn').onclick = () => updateZoom(currentZoom - 0.2);
    document.getElementById('zoomResetBtn').onclick = () => { panX = 0; panY = 0; updateZoom(1.0); };

    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      updateZoom(currentZoom + (e.deltaY < 0 ? 0.15 : -0.15));
    }, { passive: false });

    const defaultPalette = [
      '#000000', '#ffffff', '#7f7f7f', '#c3c3c3',
      '#880015', '#ed1c24', '#ff7f27', '#fff200',
      '#22b14c', '#00a2e8', '#3f48cc', '#a349a4',
      '#b97a57', '#ffaec9', '#b5e61d', '#99d9ea'
    ];

    function initPalette() {
      const paletteGrid = document.getElementById('paletteGrid');
      paletteGrid.innerHTML = '';
      defaultPalette.forEach((color, idx) => {
        const swatch = document.createElement('div');
        swatch.className = `palette-color ${idx === 0 ? 'selected' : ''}`;
        swatch.style.backgroundColor = color;
        swatch.onclick = () => {
          document.querySelectorAll('.palette-color').forEach(s => s.classList.remove('selected'));
          swatch.classList.add('selected');
          document.getElementById('colorPicker').value = color;
          isEraser = false;
          updateToolButtons();
        };
        paletteGrid.appendChild(swatch);
      });
    }

    function updateToolButtons() {
      document.getElementById('penBtn').className = !isEraser ? 'primary' : '';
      document.getElementById('eraserBtn').className = isEraser ? 'primary' : '';
    }

    document.getElementById('penBtn').onclick = () => { isEraser = false; updateToolButtons(); };
    document.getElementById('eraserBtn').onclick = () => { isEraser = true; updateToolButtons(); };
    document.getElementById('clearBtn').onclick = () => {
      if (confirm('現在のコマをクリアしますか？')) {
        frames[currentFrameIndex] = createEmptyFrame();
        render();
      }
    };

    document.getElementById('gridToggle').onchange = drawGrid;
    document.getElementById('transparentToggle').onchange = (e) => {
      wrapper.className = e.target.checked ? 'transparent-bg' : 'opaque-bg';
      render();
    };

    document.getElementById('presetSelect').onchange = (e) => {
      const val = e.target.value;
      if (val === '16x16') { setDimensions(16, 16); }
      else if (val === '32x32') { setDimensions(32, 32); }
      else if (val === '48x48') { setDimensions(48, 48); }
      else if (val === 'line_anim') { setDimensions(320, 270); }
      else if (val === 'line_static') { setDimensions(370, 320); }
      else if (val === 'line_main') { setDimensions(240, 240); }
      else if (val === 'line_tab') { setDimensions(96, 74); }
    };

    function setDimensions(w, h) {
      document.getElementById('gridW').value = w;
      document.getElementById('gridH').value = h;
    }

    document.getElementById('applySizeBtn').onclick = () => {
      const newW = parseInt(document.getElementById('gridW').value) || 16;
      const newH = parseInt(document.getElementById('gridH').value) || 16;
      if (confirm(`サイズを ${newW} × ${newH} に変更しますか？\n（キャンバスがリセットされます）`)) {
        cols = newW;
        rows = newH;
        frames = [createEmptyFrame()];
        currentFrameIndex = 0;
        panX = 0; panY = 0; currentZoom = 1.0;
        updateCanvasDimensions();
        render();
        drawGrid();
      }
    };

    document.getElementById('addFrameBtn').onclick = () => {
      frames.splice(currentFrameIndex + 1, 0, createEmptyFrame());
      currentFrameIndex++;
      render();
    };

    document.getElementById('copyFrameBtn').onclick = () => {
      const copy = JSON.parse(JSON.stringify(frames[currentFrameIndex]));
      frames.splice(currentFrameIndex + 1, 0, copy);
      currentFrameIndex++;
      render();
    };

    document.getElementById('deleteFrameBtn').onclick = () => {
      if (frames.length <= 1) {
        alert('これ以上コマを削除できません。');
        return;
      }
      frames.splice(currentFrameIndex, 1);
      if (currentFrameIndex >= frames.length) currentFrameIndex = frames.length - 1;
      render();
    };

    document.getElementById('prevFrameBtn').onclick = () => {
      if (currentFrameIndex > 0) { currentFrameIndex--; render(); }
    };

    document.getElementById('nextFrameBtn').onclick = () => {
      if (currentFrameIndex < frames.length - 1) { currentFrameIndex++; render(); }
    };

    function shiftFrameData(dx, dy) {
      const current = frames[currentFrameIndex];
      const shifted = createEmptyFrame();

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (current[r] && current[r][c]) {
            const newR = (r + dy + rows) % rows;
            const newC = (c + dx + cols) % cols;
            shifted[newR][newC] = current[r][c];
          }
        }
      }

      frames[currentFrameIndex] = shifted;
      render();
    }

    document.getElementById('shiftUpBtn').onclick = () => shiftFrameData(0, -1);
    document.getElementById('shiftDownBtn').onclick = () => shiftFrameData(0, 1);
    document.getElementById('shiftLeftBtn').onclick = () => shiftFrameData(-1, 0);
    document.getElementById('shiftRightBtn').onclick = () => shiftFrameData(1, 0);

    document.getElementById('onionToggle').onchange = render;

    document.getElementById('playBtn').onclick = (e) => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        e.target.textContent = "⏹ 停止";
        e.target.className = "danger";
        hoverCtx.clearRect(0, 0, hoverCanvas.width, hoverCanvas.height);
        
        const delay = parseInt(document.getElementById('frameDelayInput').value) || 200;
        playInterval = setInterval(() => {
          currentFrameIndex = (currentFrameIndex + 1) % frames.length;
          render();
        }, delay);
      } else {
        e.target.textContent = "▶ 再生";
        e.target.className = "primary";
        clearInterval(playInterval);
        render();
      }
    };

    function generateScaledCanvas(frameData, scale, isTransparent) {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = cols * scale;
      exportCanvas.height = rows * scale;
      const ctx = exportCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      if (!isTransparent) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      }

      drawFrameData(ctx, frameData, scale);
      return exportCanvas;
    }

    function promptFilename(defaultName) {
      return new Promise((resolve) => {
        const modal = document.getElementById('filenameModal');
        const input = document.getElementById('customFilenameInput');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');

        input.value = defaultName;
        modal.style.display = 'flex';

        const cleanup = () => {
          modal.style.display = 'none';
          confirmBtn.onclick = null;
          cancelBtn.onclick = null;
        };

        confirmBtn.onclick = () => {
          const val = input.value.trim();
          cleanup();
          resolve(val || defaultName);
        };

        cancelBtn.onclick = () => {
          cleanup();
          resolve(null);
        };
      });
    }

    // --- 保存統一処理 ---
    document.getElementById('executeExportBtn').onclick = async () => {
      const format = document.getElementById('exportFormatSelect').value;
      const btn = document.getElementById('executeExportBtn');

      const scaleMode = document.getElementById('exportScaleSelect').value;
      let scale = 1;
      if (scaleMode === 'auto_line') {
        scale = Math.floor(Math.min(320 / cols, 270 / rows)) || 1;
      } else {
        scale = parseInt(scaleMode) || 1;
      }

      const outWidth = cols * scale;
      const outHeight = rows * scale;
      const isTransparent = document.getElementById('transparentToggle').checked;
      const delayMs = parseInt(document.getElementById('frameDelayInput').value) || 200;

      // --- PNG保存 (静止画) ---
      if (format === 'png') {
        const defaultName = `stamp_${outWidth}x${outHeight}_frame${currentFrameIndex + 1}.png`;
        const filename = await promptFilename(defaultName);
        if (!filename) return;

        const finalName = filename.endsWith('.png') ? filename : `${filename}.png`;
        const canvas = generateScaledCanvas(frames[currentFrameIndex], scale, isTransparent);
        
        const link = document.createElement('a');
        link.download = finalName;
        link.href = canvas.toDataURL('image/png');
        link.click();
        return;
      }

      // --- APNG保存 ---
      if (format === 'apng') {
        const defaultName = `line_stamp_${outWidth}x${outHeight}.png`;
        const filename = await promptFilename(defaultName);
        if (!filename) return;

        const finalName = filename.endsWith('.png') ? filename : `${filename}.png`;
        const loopCount = parseInt(document.getElementById('loopCountSelect').value);

        btn.textContent = "APNG生成中...";
        btn.disabled = true;

        try {
          const canvasUrls = frames.map(f => generateScaledCanvas(f, scale, isTransparent).toDataURL('image/png'));
          const encoder = new StandaloneApngEncoder(outWidth, outHeight, delayMs, loopCount);
          const apngBlob = await encoder.createPngBlob(canvasUrls);

          const url = URL.createObjectURL(apngBlob);
          const link = document.createElement('a');
          link.download = finalName;
          link.href = url;
          link.click();
        } catch (err) {
          alert("APNG保存エラー: " + err.message);
        } finally {
          btn.textContent = "💾 指定した形式で保存";
          btn.disabled = false;
        }
        return;
      }

      // --- GIF保存 ---
      if (format === 'gif') {
        if (typeof omggif === 'undefined') {
          alert("GIFエンコードライブラリが読み込まれていません。ネットワーク接続を確認してください。");
          return;
        }

        const defaultName = `animation_${outWidth}x${outHeight}.gif`;
        const filename = await promptFilename(defaultName);
        if (!filename) return;

        const finalName = filename.endsWith('.gif') ? filename : `${filename}.gif`;

        btn.textContent = "GIF生成中...";
        btn.disabled = true;

        setTimeout(() => {
          try {
            const buffer = new Uint8Array(outWidth * outHeight * frames.length * 5);
            const gifWriter = new omggif.GifWriter(buffer, outWidth, outHeight, { loop: 0 });

            frames.forEach(frameData => {
              const canvas = generateScaledCanvas(frameData, scale, isTransparent);
              const ctx = canvas.getContext('2d');
              const imgData = ctx.getImageData(0, 0, outWidth, outHeight);
              const pixels = imgData.data;

              const paletteMap = new Map();
              const palette = [];
              const indexedPixels = new Uint8Array(outWidth * outHeight);

              let transparentIndex = -1;

              for (let i = 0; i < pixels.length; i += 4) {
                const r = pixels[i];
                const g = pixels[i + 1];
                const b = pixels[i + 2];
                const a = pixels[i + 3];

                if (a < 128) {
                  if (transparentIndex === -1) {
                    transparentIndex = palette.length;
                    palette.push(0x000000);
                  }
                  indexedPixels[i / 4] = transparentIndex;
                  continue;
                }

                const colorInt = (r << 16) | (g << 8) | b;
                if (!paletteMap.has(colorInt)) {
                  if (palette.length >= 256) {
                    paletteMap.set(colorInt, 0);
                  } else {
                    paletteMap.set(colorInt, palette.length);
                    palette.push(colorInt);
                  }
                }
                indexedPixels[i / 4] = paletteMap.get(colorInt);
              }

              while (palette.length < 2) palette.push(0x000000);

              const frameOptions = {
                delay: Math.round(delayMs / 10),
                palette: palette
              };

              if (transparentIndex !== -1) {
                frameOptions.transparent = transparentIndex;
                frameOptions.disposal = 2; // 前のコマをクリア
              }

              gifWriter.addFrame(0, 0, outWidth, outHeight, indexedPixels, frameOptions);
            });

            const gifData = buffer.subarray(0, gifWriter.end());
            const blob = new Blob([gifData], { type: 'image/gif' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.download = finalName;
            link.href = url;
            link.click();
          } catch (err) {
            alert("GIF生成エラー: " + err.message);
            console.error(err);
          } finally {
            btn.textContent = "💾 指定した形式で保存";
            btn.disabled = false;
          }
        }, 50);
        return;
      }

      // --- WebM保存 ---
      if (format === 'webm') {
        try {
          const stream = mainCanvas.captureStream(30);
          let options = { mimeType: 'video/webm' };
          let ext = 'webm';
          if (!MediaRecorder.isTypeSupported('video/webm')) {
            options = { mimeType: 'video/mp4' };
            ext = 'mp4';
          }

          const defaultName = `animation.${ext}`;
          const filename = await promptFilename(defaultName);
          if (!filename) return;

          const finalName = filename.endsWith(`.${ext}`) ? filename : `${filename}.${ext}`;

          const recorder = new MediaRecorder(stream, options);
          const chunks = [];

          recorder.ondataavailable = e => chunks.push(e.data);
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: recorder.mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = finalName;
            link.click();
          };

          recorder.start();

          let count = 0;
          const recordInterval = setInterval(() => {
            currentFrameIndex = count;
            render();
            count++;
            if (count >= frames.length) {
              clearInterval(recordInterval);
              setTimeout(() => recorder.stop(), delayMs);
            }
          }, delayMs);

        } catch (err) {
          alert("動画の保存に対応していないブラウザです。");
        }
      }
    };

    let topZIndex = 100;

    function makeDraggableAndResizable(panel) {
      const header = panel.querySelector('.panel-header');
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      const savedLayout = localStorage.getItem(`panel_layout_${panel.id}`);
      if (savedLayout) {
        const { left, top, width, height } = JSON.parse(savedLayout);
        if (left) panel.style.left = left;
        if (top) panel.style.top = top;
        if (width) panel.style.width = width;
        if (height) panel.style.height = height;
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
      }

      function startDrag(clientX, clientY) {
        isDragging = true;
        startX = clientX;
        startY = clientY;
        const rect = panel.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        topZIndex++;
        panel.style.zIndex = topZIndex;
      }

      function moveDrag(clientX, clientY) {
        if (!isDragging) return;

        const deltaX = clientX - startX;
        const deltaY = clientY - startY;

        let newLeft = initialLeft + deltaX;
        let newTop = initialTop + deltaY;

        const maxLeft = window.innerWidth - panel.offsetWidth;
        const maxTop = window.innerHeight - panel.offsetHeight;

        newLeft = Math.max(0, Math.min(newLeft, maxLeft));
        newTop = Math.max(0, Math.min(newTop, maxTop));

        panel.style.left = `${newLeft}px`;
        panel.style.top = `${newTop}px`;
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
      }

      function endDrag() {
        if (isDragging) {
          isDragging = false;
          savePanelLayout(panel);
        }
      }

      header.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
      document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
      document.addEventListener('mouseup', endDrag);

      header.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startDrag(touch.clientX, touch.clientY);
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        moveDrag(touch.clientX, touch.clientY);
      }, { passive: true });

      document.addEventListener('touchend', endDrag);

      const resizeObserver = new ResizeObserver(() => {
        savePanelLayout(panel);
      });
      resizeObserver.observe(panel);
    }

    function savePanelLayout(panel) {
      localStorage.setItem(`panel_layout_${panel.id}`, JSON.stringify({
        left: panel.style.left,
        top: panel.style.top,
        width: panel.style.width,
        height: panel.style.height
      }));
    }

    document.querySelectorAll('.draggable-panel').forEach(makeDraggableAndResizable);

    initEditor();
    initPalette();
  </script>
</body>
</html>
